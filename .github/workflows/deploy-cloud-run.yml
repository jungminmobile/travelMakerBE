name: Deploy to Cloud Run

on:
  push:
    branches:
      - release
  workflow_dispatch:

concurrency:
  group: deploy-cloud-run-${{ github.ref }}
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'gen-lang-client-0144634141' }}
  GCP_REGION: ${{ vars.GCP_REGION || 'asia-northeast3' }}
  CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'travel-maker-backend' }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY || 'travel-maker' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: |
          chmod +x gradlew
          ./gradlew test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ env.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.CLOUD_RUN_SERVICE }}:${{ github.sha }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.CLOUD_RUN_SERVICE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.CLOUD_RUN_SERVICE }}:${{ github.sha }}
          flags: '--allow-unauthenticated --cpu=1 --memory=1Gi --min-instances=0 --max-instances=3 --timeout=120 --no-cpu-throttling'
          env_vars: |
            SPRING_PROFILES_ACTIVE=prod
            FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID || 'gen-lang-client-0144634141' }}
            FRONTEND_ORIGIN=${{ vars.FRONTEND_ORIGIN || 'http://localhost:5173' }}
            DB_URL=${{ secrets.DB_URL }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            JPA_DDL_AUTO=${{ vars.JPA_DDL_AUTO || 'update' }}
            AI_GENERATOR=${{ vars.AI_GENERATOR || 'ai' }}
            AI_SERVER_BASE_URL=${{ vars.AI_SERVER_BASE_URL || 'http://localhost:8000' }}
          secrets: |
            DB_PASSWORD=${{ vars.DB_PASSWORD_SECRET || 'travel-maker-db-password' }}:latest

      - name: Write deployment summary
        run: |
          echo "### Cloud Run Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Service: \`${{ env.CLOUD_RUN_SERVICE }}\` (${{ env.GCP_REGION }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
